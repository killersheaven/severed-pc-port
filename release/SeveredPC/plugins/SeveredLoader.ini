; SeveredLoader settings (Dead Space 2: Severed PC port, v0.2-wip)
;
; [Launch]
;   Trigger=menu   New Game follows the episode you pick in the menu (main campaign or Severed). Recommended.
;   Checkpoint=    where the Severed episode starts. XONTREALPR_CB22182_E50854D_v3 = the very beginning (intro cutscene),
;                  XMARINELLO_CB806AB_62AC82F_v3 = right after the intro.
;   SaveRouting=1  Continue/Load of a Severed save goes to Severed (decided by the save's checkpoint).
[Launch]
Folder=pdlc1_ch01_mng
StreamList=pdlc1_ch01_mng.str
Trigger=menu
Checkpoint=XONTREALPR_CB22182_E50854D_v3
SaveRouting=1
SafetyPatch=1
LogStreams=1

[Menu]
; 1 = show "Dead Space 2: Severed" in the episode list. The installers set this to 0 when no Severed data (DS2DAT3.DAT) is found.
AddEpisode=1

[Render]
AmbientScale=1.0
SeveredOnly=1

[Debug]
; Safety nets for known crashes (keep on). LockGuard copies every buffer lock (diagnostics only, causes stutter): keep 0.
StaleGuard=1
LockGuard=0
